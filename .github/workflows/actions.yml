name: Cold Email Automation Runner

on:
  schedule:
    # Har 30 daqiqada ishlaydi (GitHub serverlari uchun eng barqaror va xavfsiz interval)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cold-email-runner
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Run Automation Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_NAME: "Cold Email Leads"
        run: python run.py
