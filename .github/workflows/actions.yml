import modal

app = modal.App("cold-email-continuous")

image = modal.Image.debian_slim().pip_install(
    "gspread", 
    "google-auth", 
    "python-dotenv"
)

# Modal har 1 minutda avtomat ishga tushiradi
@app.function(
    image=image,
    secrets=[modal.Secret.from_name("email-secrets")],
    schedule=modal.Period(minutes=1),
    timeout=300
)
def run_job():
    import run  # Sizning run.py faylingiz
    
    print("Modal ishni boshladi...")
    
    # run.py ichidagi asosiy funksiyani chaqiramiz
    if hasattr(run, 'main'):
        run.main()
    elif hasattr(run, 'start'):
        run.start()
    else:
        # Agar funksiya emas, shunchaki python fayli bo'lsa
        exec(open("run.py").read())
