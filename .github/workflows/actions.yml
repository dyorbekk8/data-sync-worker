import modal
import time
import random

app = modal.App("cold-email-continuous")

# Kerakli kutubxonalar
image = modal.Image.debian_slim().pip_install(
    "gspread", 
    "google-auth", 
    "python-dotenv"
)

# Har 1 minutda avtomatik tekshirib, yangi lead bor-yo'qligini nazorat qiladi
@app.function(
    image=image,
    secrets=[modal.Secret.from_name("email-secrets")],
    schedule=modal.Period(minutes=1), # Modal har 1 minutda buni o'zi avtomat yuritadi!
    timeout=300
)
def run_job():
    import run # run.py faylingiz
    
    print("Modal orqali yuborish tekshirilmoqda...")
    
    try:
        # run.py ichidagi asosiy funksiyani chaqiring
        # Masalan run.main() yoki sizda qanday nomlangan bo'lsa
        if hasattr(run, 'main'):
            run.main()
        elif hasattr(run, 'start'):
            run.start()
        else:
            print("run.py ichidan ishga tushirish funksiyasi topilmadi!")
    except Exception as e:
        print(f"Xatolik yuz berdi: {e}")
